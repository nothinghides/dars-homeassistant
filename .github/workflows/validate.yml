name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' is ignored until the home-assistant/brands PR for
          # dars_remote_id is merged; remove this once the icon is live.
          # 'license' is ignored on purpose: this project ships under the
          # PolyForm Noncommercial License, which GitHub does not SPDX-detect,
          # so it is distributed as a HACS *custom* repository (not the default
          # store, which requires an OSI-recognised licence).
          ignore: brands license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' is ignored on purpose: brand icons are bundled locally in
          # custom_components/dars_remote_id/brand/ (HA 2026.3.0+ self-hosted
          # brand images), so this integration is intentionally NOT in the
          # home-assistant/brands CDN that this check validates against.
          # 'license' is ignored on purpose: this project ships under the
          # PolyForm Noncommercial License, which GitHub does not SPDX-detect,
          # so it is distributed as a HACS *custom* repository (not the default
          # store, which requires an OSI-recognised licence).
          ignore: brands license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
